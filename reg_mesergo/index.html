<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הקמת חשבון עסקי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --brand: #1877C2;
    --brand-ink: #0F5FA0;
    --yellow: #F5D21A;
    --teal: #12B5A5;
    --teal-soft: #E6F7F4;
    --wa: #25D366;
    --wa-ink: #0E7A3C;

    --bg: #EEF2F6;
    --surface: #FFFFFF;
    --surface-2: #F7F9FB;
    --text: #1A1A2E;
    --subtext: #6B7280;
    --border: #E5E7EB;
    --hairline: #EDF1F5;
    --error: #C0392B;

    --brand-wash: rgba(24,119,194,.08);
    --brand-line: rgba(24,119,194,.22);
    --yellow-wash: rgba(245,210,26,.16);
    --shadow: 0 1px 2px rgba(20,40,80,.05), 0 10px 34px rgba(20,40,80,.09);
    --shadow-soft: 0 1px 2px rgba(20,40,80,.04), 0 4px 14px rgba(20,40,80,.05);
    --radius: 10px;
    --radius-lg: 16px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #0A0F18;
      --surface: #141C28;
      --surface-2: #0F1622;
      --text: #E8EDF3;
      --subtext: #94A1B2;
      --border: #263143;
      --hairline: #1E2836;
      --brand-wash: rgba(46,142,214,.14);
      --brand-line: rgba(46,142,214,.34);
      --yellow-wash: rgba(245,210,26,.12);
      --teal-soft: rgba(18,181,165,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 34px rgba(0,0,0,.42);
      --shadow-soft: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0F18;
    --surface: #141C28;
    --surface-2: #0F1622;
    --text: #E8EDF3;
    --subtext: #94A1B2;
    --border: #263143;
    --hairline: #1E2836;
    --brand-wash: rgba(46,142,214,.14);
    --brand-line: rgba(46,142,214,.34);
    --yellow-wash: rgba(245,210,26,.12);
    --teal-soft: rgba(18,181,165,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 34px rgba(0,0,0,.42);
    --shadow-soft: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    direction: rtl;
    background:
      radial-gradient(1200px 600px at 90% -10%, var(--brand-wash), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Heebo', 'Segoe UI', Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; direction: ltr; unicode-bidi: embed; }

  /* ---------- shell ---------- */
  .app {
    width: 100%;
    max-width: 468px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: min(720px, calc(100dvh - 48px));
  }

  /* ---------- header ---------- */
  .head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 16px 20px 12px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .name { font-weight: 800; font-size: 16px; letter-spacing: -.2px; }
  .exit {
    background: none; border: 0; color: var(--subtext); font: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px; border-radius: 8px;
  }
  .exit:hover { color: var(--text); }

  .logo { position: relative; width: 30px; height: 30px; flex-shrink: 0; }
  .logo .eye { position: absolute; left: 0; bottom: 0; width: 25px; height: 25px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; }
  .logo .white { width: 15.5px; height: 15.5px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .logo .iris { position: relative; width: 12.5px; height: 12.5px; border-radius: 50%; background: #4A4A4A; }
  .logo .hi { position: absolute; top: 1.5px; right: 1.5px; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
  .logo .dot { position: absolute; top: 0; right: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }

  .processtitle { padding: 0 20px 12px; font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  .progress { padding: 0 20px 14px; }
  .track { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--brand), #3E9BE0);
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }
  .steplabel { font-size: 12px; color: var(--subtext); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* ---------- step body ---------- */
  .body { flex: 1; overflow-y: auto; padding: 8px 24px 4px; }
  .stepicon {
    width: 58px; height: 58px; border-radius: 18px; margin: 6px auto 16px;
    background: var(--brand-wash); display: grid; place-items: center;
    color: var(--brand); border: 1px solid var(--brand-line);
  }
  .stepicon svg { width: 28px; height: 28px; }
  h1.title { font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.3px; text-wrap: balance; }
  p.subtitle { color: var(--subtext); font-size: 15px; margin: 0 0 4px; }
  .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }

  .enter { animation: enter .4s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .enter { animation: none; }
    .fill { transition: none; }
  }

  /* ---------- choice cards ---------- */
  .choice {
    display: flex; align-items: center; gap: 12px; text-align: right;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 14px; cursor: pointer; width: 100%; font: inherit;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .choice:hover { border-color: var(--brand-line); }
  .choice:active { transform: scale(.995); }
  .choice.sel { border-color: var(--teal); background: var(--teal-soft); }
  .choice .cIcon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; background: var(--brand-wash); color: var(--brand);
  }
  .choice.sel .cIcon { background: var(--brand); color: #fff; }
  .choice .cText { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .choice .cTitle { font-weight: 700; font-size: 15px; }
  .choice .cDesc { font-size: 13px; color: var(--subtext); line-height: 1.45; }
  .choice .cMark { color: var(--border); flex-shrink: 0; }
  .choice.sel .cMark { color: var(--teal); }
  .choice svg { width: 20px; height: 20px; }
  .choice .cMark svg { width: 22px; height: 22px; }

  /* ---------- notice / guide / note ---------- */
  .notice {
    background: var(--brand-wash); border: 1px solid var(--brand-line);
    border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .notice .nHead { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .notice .nHead svg { width: 18px; height: 18px; color: var(--brand); flex-shrink: 0; }
  .notice ul { margin: 0; padding: 0 22px 0 0; }
  .notice li { font-size: 14px; }
  .notice.wa { background: rgba(37,211,102,.09); border-color: rgba(37,211,102,.32); }
  .notice.wa .nHead svg { color: var(--wa-ink); }

  .guide {
    margin-top: 6px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .guide h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .gnote { margin: 0; font-size: 14px; color: var(--subtext); line-height: 1.5; }
  .savedbadge {
    display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700;
    color: var(--teal); background: var(--teal-soft); border-radius: 10px; padding: 10px 12px;
  }
  .savedbadge svg { width: 18px; height: 18px; flex-shrink: 0; }
  .gstep { display: flex; align-items: flex-start; gap: 12px; }
  .gnum {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: var(--brand); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
  }
  .gstep span { font-size: 14px; line-height: 1.5; padding-top: 2px; }
  .savednote {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--yellow-wash); border-radius: 10px; padding: 12px; font-size: 13px;
  }
  .savednote svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 3px; color: #B8860B; }

  /* ---------- use-case sub-question (agents) ---------- */
  .agentsbox {
    margin-top: 6px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .agentsbox h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 9px 16px; font: inherit; font-size: 14px; font-weight: 700; color: var(--subtext); cursor: pointer;
  }
  .chip:hover { border-color: var(--brand-line); }
  .chip.sel { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }

  /* ---------- secondary button ---------- */
  .btn2 {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: 1.5px solid var(--brand); color: var(--brand);
    background: var(--surface); border-radius: var(--radius); padding: 13px;
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .btn2:hover { background: var(--brand-wash); }
  .btn2 svg { width: 18px; height: 18px; }
  .btn2.g { border-color: var(--border); color: var(--text); }
  .gmark { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0); flex-shrink: 0; }
  .connected { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; color: var(--teal); font-weight: 700; }
  .connected svg { width: 22px; height: 22px; }
  .err { color: var(--error); font-size: 13px; text-align: center; margin: 4px 0 0; }

  /* ---------- virtual numbers ---------- */
  .vn {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: right;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 14px; cursor: pointer; font: inherit; transition: border-color .15s, background .15s;
  }
  .vn:hover { border-color: var(--brand-line); }
  .vn.sel { border-color: var(--teal); background: var(--teal-soft); }
  .vn .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: grid; place-items: center; }
  .vn.sel .radio { border-color: var(--teal); }
  .vn.sel .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); }
  .vn .num { flex: 1; display: flex; flex-direction: column; }
  .vn .digits { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .vn .region { font-size: 12px; color: var(--subtext); }
  .vn .price { font-size: 13px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
  .loading { text-align: center; color: var(--subtext); padding: 30px 0; font-size: 14px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; margin: 0 auto 10px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- tips (done) ---------- */
  .tip {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
  }
  .tip .tIcon { width: 40px; height: 40px; border-radius: 10px; background: var(--brand-wash); color: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
  .tip .tIcon svg { width: 20px; height: 20px; }
  .tip .tTitle { font-weight: 700; font-size: 15px; }
  .tip .tDesc { font-size: 13px; color: var(--subtext); line-height: 1.45; }

  /* ---------- footer ---------- */
  .foot {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .back {
    background: none; border: 0; color: var(--subtext); font: inherit; font-weight: 700;
    font-size: 15px; cursor: pointer; padding: 12px; border-radius: 8px;
  }
  .back:hover { color: var(--text); }
  .next {
    flex: 1; background: var(--brand); color: #fff; border: 0; border-radius: var(--radius);
    padding: 15px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    transition: filter .15s, opacity .15s;
  }
  .next:hover:not(:disabled) { filter: brightness(1.06); }
  .next:disabled { opacity: .4; cursor: not-allowed; }

  /* ---------- pause / continue-later bar ---------- */
  .pausebar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 20px 16px; background: var(--surface); text-align: center;
  }
  .pausebar svg { width: 16px; height: 16px; color: var(--subtext); flex-shrink: 0; }
  .pauselink {
    background: none; border: 0; color: var(--brand); font: inherit;
    font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 4px 2px;
  }
  .pauselink:hover { text-decoration: underline; text-underline-offset: 3px; }

  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

  /* ---------- success overlay ---------- */
  .done-screen { text-align: center; padding: 20px 0; }
  .done-badge {
    width: 84px; height: 84px; border-radius: 50%; margin: 10px auto 18px;
    background: var(--teal-soft); color: var(--teal); display: grid; place-items: center;
    animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .done-badge svg { width: 46px; height: 46px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <div class="dot"></div>
        <div class="eye"><div class="white"><div class="iris"><div class="hi"></div></div></div></div>
      </div>
      <span class="name">מסר גו</span>
    </div>
    <button class="exit" id="exitBtn" type="button">התחלה מחדש</button>
  </div>

  <div class="processtitle">הקמת החשבון העסקי שלך</div>

  <div class="progress">
    <div class="track"><div class="fill" id="fill" style="width:14%"></div></div>
    <div class="steplabel" id="steplabel"></div>
  </div>

  <div class="body" id="body"></div>

  <div class="foot">
    <button class="back" id="backBtn" type="button">חזרה</button>
    <button class="next" id="nextBtn" type="button">המשך</button>
  </div>

  <div class="pausebar" id="pausebar">
    <button class="pauselink" id="pauseBtn" type="button">רשמו אותי, אמשיך את תהליך החיבור אח״כ</button>
  </div>
</div>

  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (I[name] || "") + '</svg>'; }

  // ---- real Google sign-in (Google Identity Services) ----
  // Mirrors frontend/components/RegisterPage.tsx: render the official Google button
  // (reliable, real user-gesture popup) rather than a custom button + prompt(), which
  // FedCM/browser heuristics can silently skip.
  function initGoogle() {
    if (googleReady || !window.google) return;
    window.google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: function (response) { handleGoogleCredential(response.credential); }
    });
    googleReady = true;
    renderPendingGoogleButtons();
  }
  function renderGoogleButton(containerId) {
    var el = document.getElementById(containerId);
    if (!el || !googleReady) return;
    el.innerHTML = "";
    window.google.accounts.id.renderButton(el, { theme: "outline", size: "large", width: 280, locale: "he", text: "signup_with" });
  }
  // Called after every render() — (re)draws whichever google-btn-* container is
  // currently in the DOM. At most one exists at a time by construction (see
  // pauseAndSave), so the context each sets is unambiguous for the shared callback below.
  function renderPendingGoogleButtons() {
    if (document.getElementById("google-btn-main")) { pendingGoogleContext = "main"; renderGoogleButton("google-btn-main"); }
    if (document.getElementById("google-btn-fbsave")) { pendingGoogleContext = "fbsave"; renderGoogleButton("google-btn-fbsave"); }
    if (document.getElementById("google-btn-pause")) { pendingGoogleContext = "pause"; renderGoogleButton("google-btn-pause"); }
  }
  (function loadGoogle() {
    var s = document.querySelector('script[src*="accounts.google.com/gsi"]');
    if (!s) return;
    if (window.google) { initGoogle(); return; }
    s.addEventListener("load", initGoogle);
  })();

  // Real sign-in/sign-up: creates or logs into an actual account (backend POST /auth/google),
  // then stores the same flowbot_token/flowbot_user the main dashboard reads — this is what
  // makes "resume later" and the dashboard's onboarding banner real instead of a local mock.
  function handleGoogleCredential(credential) {
    authError = "";
    fetch(API_BASE + "/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ credential: credential })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (r.ok && r.data.token) {
          try {
            localStorage.setItem("flowbot_token", r.data.token);
            localStorage.setItem("flowbot_user", JSON.stringify(r.data.user));
            window.dispatchEvent(new Event("flowbot-auth-change"));
          } catch (e) {}
          authToken = r.data.token;
          var ctx = pendingGoogleContext;
          pendingGoogleContext = null;
          setAnswer({ googleConnected: true }); // save()+render(); save() also pushes progress to the server now that authToken is set
          if (ctx === "pause") {
            pauseGoogleMode = false;
            pausedView = true;
            save();
            render();
          }
        } else {
          authError = (r.data && r.data.error) || "ההתחברות נכשלה, נסה שוב";
          render();
        }
      })
      .catch(function () {
        authError = "שגיאת רשת, נסה שוב";
        render();
      });
  }

  // Pushes the wizard's current step + answers to the server, so the dashboard's
  // onboarding banner (and a return visit on any device) can resume from the exact
  // spot the visitor left off on. No-op while anonymous (no real account yet).
  function syncToBackend() {
    if (!authToken) return;
    fetch(API_BASE + "/auth/onboarding", {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({ current_step: state.stepId, answers: state.answers, completed: state.completed })
    }).catch(function () {});
  }
  // Pulls saved progress from the server on load (e.g. arriving via the dashboard's
  // "להשלמת התהליך" banner) so the wizard reopens at the right step, cross-device.
  function restoreFromBackend() {
    if (!authToken) return Promise.resolve();
    return fetch(API_BASE + "/auth/onboarding", { headers: { Authorization: "Bearer " + authToken } })
      .then(function (res) {
        if (res.status === 401 || res.status === 403) {
          authToken = null;
          try { localStorage.removeItem("flowbot_token"); localStorage.removeItem("flowbot_user"); } catch (e) {}
          return null;
        }
        return res.ok ? res.json() : null;
      })
      .then(function (data) {
        if (!data) return;
        state.stepId = data.current_step || state.stepId;
        state.completed = !!data.completed;
        state.answers = Object.assign(defaults().answers, data.answers || {});
        save();
      })
      .catch(function () {});
  }

  // ---- state ----
  var state = load();
  var selectedVn = null;      // transient selection on the virtual-number step
  var loadingNumbers = false; // simulates the network fetch

  var pauseGoogleMode = false; // true | "hint" — pausebar is showing its own Google button / a pointer to one already on screen

  function defaults() {
    return {
      stepId: "intro",
      completed: false,
      answers: { useCases: [], agentCount: null, fbStatus: null, numberStatus: null, virtualNumber: null, googleConnected: false, fbConnected: false }
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaults();
      var p = JSON.parse(raw);
      var d = defaults();
      return { stepId: p.stepId || "intro", completed: !!p.completed, answers: Object.assign(d.answers, p.answers || {}) };
    } catch (e) { return defaults(); }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    syncToBackend();
  }

  function order() {
    var s = ["intro", "usecases", "facebook", "number"];
    if (state.answers.numberStatus === "none") s.push("virtual");
    s.push("google", "connect", "done");
    return s;
  }
  function setAnswer(patch) { Object.assign(state.answers, patch); save(); render(); }
  function go(step) { state.stepId = step; save(); render(); }
  function next() { var o = order(), i = o.indexOf(state.stepId); go(o[Math.min(i + 1, o.length - 1)]); }
  function back() { var o = order(), i = o.indexOf(state.stepId); go(o[Math.max(i - 1, 0)]); }

      var tips = [
        { icon: "docs", t: "תבניות הודעה", d: "צור תבניות מאושרות לשליחה יזומה ללקוחות." },
        { icon: "send", t: "הודעה ראשונה", d: "שלח הודעת בדיקה כדי לוודא שהכול עובד." },
        { icon: "bots", t: "בוטים ואוטומציות", d: "הגדר מענה אוטומטי לפניות נפוצות." }
      ];
      var rows = tips.map(function (x) {
        return '<div class="tip"><div class="tIcon">' + svg(x.icon) + '</div><div><div class="tTitle">' + x.t + '</div><div class="tDesc">' + x.d + "</div></div></div>";
      }).join("");
      return {
        icon: "sparkles",
        title: "הכול מוכן! 🎉",
        subtitle: "הוואטסאפ העסקי שלך מחובר. הנה כמה צעדים ראשונים כדי להתחיל:",
        html: '<div class="stack">' + rows + "</div>",
        showBack: true,
        next: { label: "כניסה למערכת", enabled: true, onClick: function () { state.completed = true; save(); render(); } }
      };
    }
  };

  // ---- html helpers ----
  function choiceCard(o, sel, field) {
    return '<button class="choice' + (sel ? " sel" : "") + '" data-set="' + field + '" data-val="' + o.k + '">' +
      '<span class="cIcon">' + svg(o.icon) + "</span>" +
      '<span class="cText"><span class="cTitle">' + o.t + '</span><span class="cDesc">' + o.d + "</span></span>" +
      '<span class="cMark">' + svg(sel ? "checkc" : "") + (sel ? "" : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>') + "</span>" +
      "</button>";
  }
  function useCaseCard(o, sel) {
    var mark = sel
      ? '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="var(--teal)"/><path d="M7 12l3.2 3.2L17 8.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    return '<button class="choice' + (sel ? " sel" : "") + '" data-uc="' + o.k + '">' +
      '<span class="cIcon">' + svg(o.icon) + "</span>" +
      '<span class="cText"><span class="cTitle">' + o.t + '</span><span class="cDesc">' + o.d + "</span></span>" +
      '<span class="cMark">' + mark + "</span></button>";
  }
  function guideSteps(arr) {
    return arr.map(function (s, i) {
      return '<div class="gstep"><span class="gnum">' + (i + 1) + "</span><span>" + s + "</span></div>";
    }).join("");
  }
  function savedNote(txt) { return '<div class="savednote">' + svg("bookmark") + "<span>" + txt + "</span></div>"; }

  // ---- render ----
  var bodyEl = document.getElementById("body");
  var fillEl = document.getElementById("fill");
  var stepLabelEl = document.getElementById("steplabel");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var footEl = nextBtn.parentNode;
  var pausebarEl = document.getElementById("pausebar");

  // "רשמו אותי, אמשיך אח״כ" — נרשמים עם Google (חשבון אמיתי), שומרים את המקום בשרת, ומציגים מסך אישור.
  function pauseAndSave() {
    if (authToken) {
      // Already a real account — nothing more to connect, just confirm the pause.
      pausedView = true;
      save();
      render();
      return;
    }
    // A Google-sign-in button for this exact purpose is already visible on these two
    // steps — avoid rendering a second, colliding one; just point at it instead.
    var stepAlreadyShowsGoogleButton =
      state.stepId === "google" ||
      (state.stepId === "facebook" && state.answers.fbStatus === "none");
    pauseGoogleMode = stepAlreadyShowsGoogleButton ? "hint" : true;
    render();
  }
  // Renders the pausebar's content: the normal link, or (while awaiting a real
  // Google sign-in to create the account) its own button / a pointer to the one
  // already on screen. Re-wires its own listeners each time since innerHTML is replaced.
  function renderPausebar() {
    if (pauseGoogleMode === "hint") {
      pausebarEl.innerHTML =
        '<span style="font-size:12.5px;color:var(--subtext)">התחבר עם Google למעלה כדי לשמור את ההתקדמות</span>' +
        '<button class="pauselink" id="cancelPauseBtn" type="button">ביטול</button>';
    } else if (pauseGoogleMode === true) {
      pausebarEl.innerHTML =
        '<div id="google-btn-pause" style="display:flex;justify-content:center;"></div>' +
        '<button class="pauselink" id="cancelPauseBtn" type="button" style="font-size:12px;">ביטול</button>';
    } else {
      pausebarEl.innerHTML = '<button class="pauselink" id="pauseBtn" type="button">רשמו אותי, אמשיך את תהליך החיבור אח״כ</button>';
    }
    var pb = document.getElementById("pauseBtn");
    if (pb) pb.addEventListener("click", pauseAndSave);
    var cb = document.getElementById("cancelPauseBtn");
    if (cb) cb.addEventListener("click", function () { pauseGoogleMode = false; render(); });
  }
  function pausedScreen() {
    return '<div class="done-screen enter"><div class="done-badge" style="background:var(--brand-wash);color:var(--brand)">' + svg("bookmark") + "</div>" +
      '<h1 class="title" style="text-align:center">נרשמת! שמרנו את המקום שלך</h1>' +
      '<p class="subtitle" style="text-align:center">אין בעיה לעצור כאן. נרשמת עם Google ושמרנו בדיוק את השלב שבו אתה נמצא — חזור בכל עת (מהקישור הזה או מהאפליקציה) כדי להמשיך את החיבור מאותה נקודה.</p></div>';
  }

  function render() {
    // מסך "נרשמת — נמשיך אח״כ"
    if (pausedView) {
      bodyEl.innerHTML = pausedScreen();
      bodyEl.scrollTop = 0;
      footEl.style.display = "flex";
      backBtn.style.visibility = "hidden";
      nextBtn.textContent = "המשך עכשיו";
      nextBtn.disabled = false;
      nextBtn.onclick = function () { pausedView = false; render(); };
      pausebarEl.style.display = "none";
      return;
    }

    var o = order();
    var idx = Math.max(0, o.indexOf(state.stepId));
    var total = o.length;
    var s = steps[state.stepId]();

    // progress
    fillEl.style.width = ((idx + 1) / total * 100) + "%";
    stepLabelEl.textContent = "שלב " + (idx + 1) + " מתוך " + total;

    // body
    var head = s.done ? "" :
      '<div class="stepicon">' + svg(s.icon) + "</div>" +
      '<h1 class="title">' + s.title + "</h1>" +
      '<p class="subtitle">' + s.subtitle + "</p>";
    bodyEl.innerHTML = '<div class="enter">' + head + s.html + "</div>";
    bodyEl.scrollTop = 0;

    // footer
    if (s.done && !s.next) { footEl.style.display = "none"; }
    else {
      footEl.style.display = "flex";
      backBtn.style.visibility = s.showBack ? "visible" : "hidden";
      nextBtn.textContent = s.next.label;
      nextBtn.disabled = !s.next.enabled;
      nextBtn.onclick = s.next.enabled ? s.next.onClick : null;
    }

    // "רשמו אותי, אמשיך אח״כ" — מוצג בכל שלב פרט לשלב הסיום.
    pausebarEl.style.display = (state.stepId === "done") ? "none" : "flex";
    renderPausebar();

    wire();
  }

  function wire() {
    // choice cards
    Array.prototype.forEach.call(bodyEl.querySelectorAll("[data-set]"), function (el) {
      el.addEventListener("click", function () {
        var patch = {}; patch[el.getAttribute("data-set")] = el.getAttribute("data-val");
        setAnswer(patch);
      });
    });
    // use-case multi-select toggle
    Array.prototype.forEach.call(bodyEl.querySelectorAll("[data-uc]"), function (el) {
      el.addEventListener("click", function () {
        var k = el.getAttribute("data-uc");
        var cases = (state.answers.useCases || []).slice();
        var i = cases.indexOf(k);
        if (i === -1) cases.push(k); else cases.splice(i, 1);
        var patch = { useCases: cases };
        if (k === "conversations" && i !== -1) patch.agentCount = null; // ביטול שיחות מנקה נציגים
        setAnswer(patch);
      });
    });
    // agent-count single-select
    Array.prototype.forEach.call(bodyEl.querySelectorAll("[data-agent]"), function (el) {
      el.addEventListener("click", function () { setAnswer({ agentCount: el.getAttribute("data-agent") }); });
    });
    // external open links
    Array.prototype.forEach.call(bodyEl.querySelectorAll("[data-open]"), function (el) {
      el.addEventListener("click", function () { window.open(el.getAttribute("data-open"), "_blank", "noopener"); });
    });
    // virtual number pick
    Array.prototype.forEach.call(bodyEl.querySelectorAll("[data-vn]"), function (el) {
      el.addEventListener("click", function () { selectedVn = el.getAttribute("data-vn"); render(); });
    });
    // real Google sign-in buttons (main "google" step + facebook "no account" branch +
    // pausebar), rendered by the GIS SDK into whichever google-btn-* container exists now.
    renderPendingGoogleButtons();
    // facebook connect — still simulated: real Meta Embedded Signup needs its own SDK
    // popup + app id, out of scope here (see whatsappRegistrationRoutes.js for the real flow).
    var fbBtn = document.getElementById("fbBtn");
    if (fbBtn) fbBtn.addEventListener("click", function () {
      window.open("https://business.facebook.com/wa/manage/", "_blank", "noopener");
      setAnswer({ fbConnected: true });
    });
  }

  // simulate a short fetch whenever the virtual step is shown fresh
  var lastStep = null;
  var _origRender = render;
  render = function () {
    if (state.stepId === "virtual" && lastStep !== "virtual" && !state.answers.virtualNumber) {
      loadingNumbers = true;
      _origRender();
      lastStep = "virtual";
      setTimeout(function () { loadingNumbers = false; _origRender(); }, 650);
      return;
    }
    lastStep = state.stepId;
    _origRender();
  };

  document.getElementById("exitBtn").addEventListener("click", function () {
    state = defaults(); selectedVn = null; pausedView = false; pauseGoogleMode = false; save(); render();
  });
  backBtn.addEventListener("click", back);

  // If already signed in (returning via the dashboard's "להשלמת התהליך" banner, or a
  // direct repeat visit), pull the saved step/answers from the server before first paint.
  restoreFromBackend().then(render);
})();
</script>
</body>
</html>
